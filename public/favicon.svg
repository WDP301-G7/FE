<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(147, 51, 234);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(37, 99, 235);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Eye Icon -->
  <g transform="translate(16, 16)">
    <!-- Outer eye -->
    <ellipse cx="0" cy="0" rx="14" ry="9" fill="url(#grad)"/>
    
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    
    <!-- Pupil -->
    <circle cx="0" cy="0" r="3" fill="url(#grad)"/>
    
    <!-- Reflection -->
    <circle cx="-1" cy="-1" r="1.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
