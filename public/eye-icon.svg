<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgb(147, 51, 234);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgb(37, 99, 235);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#ffffff"/>
  
  <!-- Eye Icon -->
  <g transform="translate(100, 100)">
    <!-- Outer eye shape -->
    <path d="M -60 0 Q -60 -25, -40 -35 Q -20 -45, 0 -45 Q 20 -45, 40 -35 Q 60 -25, 60 0 Q 60 25, 40 35 Q 20 45, 0 45 Q -20 45, -40 35 Q -60 25, -60 0 Z" 
          fill="url(#eyeGradient)" stroke="url(#eyeGradient)" stroke-width="2"/>
    
    <!-- Inner circle (iris) -->
    <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.9"/>
    
    <!-- Pupil -->
    <circle cx="0" cy="0" r="10" fill="url(#eyeGradient)"/>
    
    <!-- Light reflection -->
    <circle cx="-5" cy="-5" r="4" fill="#ffffff" opacity="0.8"/>
  </g>
</svg>
